name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check engine.js
          node --check tasks.js
      - name: Action guard policy tests
        run: npm run test:action-guard
      - name: Dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high
      - name: Security dependency regression tests
        run: npm run test:security-deps
      - name: Swarm unit tests
        run: npm run test:swarm
