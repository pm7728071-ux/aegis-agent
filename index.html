<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis//Agent — Autonomous AI Security Proxy</title>
    <style>
        /* Bulletproof fallback styles - No internet download required */
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px;
            margin: 0;
            text-align: center;
        }
        .container {
            max-w: 800px;
            margin: 0 auto;
            background-color: #111827;
            border: 2px solid #1f2937;
            padding: 40px;
            border-radius: 16px;
        }
        .badge {
            background-color: rgba(16, 185, 129, 0.1);
            color: #10b981;
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: inline-block;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 36px;
            margin: 0 0 16px 0;
            color: #ffffff;
        }
        p {
            color: #d1d5db;
            max-width: 600px;
            margin: 0 auto 30px auto;
            line-height: 1.6;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 40px;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background-color: #1f2937;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #374151;
        }
        .card-title {
            color: #9ca3af;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        .card-value {
            font-size: 32px;
            font-weight: 900;
            font-family: monospace;
        }
        .blue-text { color: #3b82f6; }
        .green-text { color: #10b981; }
        .purple-text { color: #a855f7; }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">● ALL NETWORK GATES ACTIVE</span>
        
        <h1>AEGIS//AGENT SECURITY PROXY</h1>
        
        <p>Autonomous transaction-level firewall for AI agents. Securing machine traffic across Web3 Crypto and M-Pesa channels in under 2 milliseconds.</p>
        
        <a href="https://github.com" target="_blank" class="btn">
            View Open-Source SDK
        </a>

        <div class="metrics-grid">
            <div class="card" style="border-color: #3b82f6;">
                <span class="card-title">Audited Bot Tasks</span>
                <span class="card-value blue-text">0</span>
            </div>
            <div class="card" style="border-color: #10b981;">
                <span class="card-title">Toll Revenue (KES)</span>
                <span class="card-value green-text">KSh 0.00</span>
            </div>
            <div class="card" style="border-color: #a855f7;">
                <span class="card-title">Sovereign Yield (USD)</span>
                <span class="card-value purple-text">$0.0000</span>
            </div>
        </div>
    </div>

</body>
</html>
